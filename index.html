<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f7d32">
<meta name="app-version" content="1.4.0">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mežvidi">
<title>Mežvidu Draugi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=1.4.0">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch"></div>
<div id="joy-base"><div id="joy-knob"></div></div>

<div id="hud" class="hidden">
  <div id="hud-tl">
    <div class="pill" id="coins">🪙 0</div>
    <canvas id="minimap" width="140" height="140"></canvas>
  </div>
  <div id="hud-tr">
    <button class="pill" id="btn-room">👥 1/4</button>
    <button class="round" id="btn-bag" title="Soma">🎒</button>
    <button class="round" id="btn-quests" title="Uzdevumi">📜</button>
    <button class="round" id="btn-menu" title="Izvēlne">☰</button>
  </div>
  <div id="team-bar" class="pill"></div>
  <div id="toasts"></div>
  <div id="race-hud" class="hidden"></div>
  <div id="countdown" class="hidden"></div>
  <div id="hud-br">
    <button id="btn-action" class="hidden"></button>
    <div class="br-row">
      <button id="btn-emote" class="round">💬</button>
      <button id="btn-jump" class="round big">⤒</button>
    </div>
  </div>
  <div id="hud-bc">
    <button id="btn-race" class="hidden pill">🏁 Sacīkstes</button>
    <button id="btn-exit-kart" class="hidden pill">🚶 Izkāpt</button>
  </div>
  <div id="emote-menu" class="hidden"></div>
</div>

<div id="panel" class="hidden">
  <div class="panel-box">
    <div class="panel-head"><h2 id="panel-title"></h2><button id="panel-close">✕</button></div>
    <div id="panel-body"></div>
  </div>
</div>

<div id="menu">
  <div class="menu-box" id="scr-name">
    <h1>🌲 Mežvidu Draugi 🦊</h1>
    <p class="sub">Kopīga piedzīvojumu pasaule līdz 4 draugiem</p>
    <label for="in-name">Tavs vārds</label>
    <input id="in-name" maxlength="14" placeholder="Ieraksti savu vārdu" autocomplete="off">
    <div id="profiles"></div>
    <button class="btn primary" id="btn-name-ok">Tālāk ➜</button>
    <div class="version" id="version"></div>
  </div>

  <div class="menu-box hidden" id="scr-char">
    <h2>Izvēlies savu tēlu</h2>
    <canvas id="preview" width="300" height="220"></canvas>
    <div class="grid" id="animal-grid"></div>
    <label>Kažoka krāsa</label>
    <div class="swatches" id="fur-sw"></div>
    <label>Krekla krāsa</label>
    <div class="swatches" id="shirt-sw"></div>
    <div class="row">
      <button class="btn" id="btn-char-back">⬅</button>
      <button class="btn primary" id="btn-char-ok">Tālāk ➜</button>
    </div>
  </div>

  <div class="menu-box hidden" id="scr-room">
    <h2>Sveiks, <span id="hello-name"></span>!</h2>
    <p class="sub" id="save-info"></p>
    <button class="btn primary big" id="btn-host">🏠 Izveidot istabu</button>
    <div class="or">vai pievienojies draugam</div>
    <input id="in-code" maxlength="5" placeholder="ISTABAS KODS" autocomplete="off" autocapitalize="characters">
    <button class="btn big" id="btn-join">🚪 Pievienoties</button>
    <button class="btn small" id="btn-solo">🌲 Spēlēt vienam (bez interneta)</button>
    <div id="room-status"></div>
    <button class="btn small ghost" id="btn-room-back">⬅ Atpakaļ</button>
  </div>
</div>

<div id="loading" class="hidden"><div class="spinner"></div><div id="loading-text">Veidojam pasauli…</div></div>

<div id="rotate-hint">📱↻ Pagriez telefonu guļus labākai spēlei</div>

<script type="module" src="js/main.js?v=1.4.0"></script>
</body>
</html>
